name: Checks
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Install desktop test dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y python3-gi gir1.2-gtk-4.0 desktop-file-utils xvfb xauth xdotool xclip dbus-x11
      - name: Installer checks
        run: /usr/bin/python3 -m unittest discover -s tests -v
      - name: GTK workflow
        run: xvfb-run -a dbus-run-session -- /usr/bin/python3 tests/gui_smoke.py
